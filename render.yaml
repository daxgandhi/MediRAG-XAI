services:
  - type: web
    name: medirag-xai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-2
      - key: MONGODB_URI
        sync: false

