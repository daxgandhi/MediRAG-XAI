<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEDIRAG-XAI | Doctor Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
    }
    .nav-tabs .nav-link {
      color: var(--text-muted);
      border: none;
      border-bottom: 2px solid transparent;
    }
    .nav-tabs .nav-link.active {
      background: transparent;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-medirag">
  <div class="container">
    <a class="navbar-brand-logo" href="index.html">
      <div class="brand-icon"><i class="fas fa-brain"></i></div>
      <div>
        <span class="brand-text">MEDIRAG-XAI</span>
        <span class="brand-sub">Healthcare AI Platform</span>
      </div>
    </a>
  </div>
</nav>

<div class="login-container">
  <div class="card-glass login-card p-5">
    <div class="text-center mb-4">
      <div class="card-icon card-icon-blue mx-auto mb-3" style="width:60px;height:60px;font-size:1.5rem;"><i class="fas fa-user-md"></i></div>
      <h2 style="font-weight:700">Doctor Portal</h2>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-4 justify-content-center" id="authTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">Login</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">Register</button>
      </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
      <!-- Login Form -->
      <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
        <form id="doctorLoginForm">
          <div class="mb-3">
            <label class="form-label-glass">Medical ID or Email</label>
            <input type="text" id="loginIdentifier" class="form-control-glass" style="width:100%" placeholder="dr.smith@hospital.org" required>
          </div>
          <div class="mb-4">
            <label class="form-label-glass">Password</label>
            <input type="password" id="loginPassword" class="form-control-glass" style="width:100%" placeholder="••••••••" required>
          </div>
          <div id="loginError" class="text-danger mb-3" style="display:none;font-size:0.9rem"></div>
          <button type="submit" class="btn-primary-custom w-100 py-2">
            <i class="fas fa-sign-in-alt me-2"></i> Login
          </button>
        </form>
      </div>

      <!-- Register Form -->
      <div class="tab-pane fade" id="register-panel" role="tabpanel">
        <form id="doctorRegisterForm">
          <div class="mb-3">
            <label class="form-label-glass">Full Name</label>
            <input type="text" id="registerName" class="form-control-glass" style="width:100%" placeholder="Dr. John Smith" required>
          </div>
          <div class="mb-3">
            <label class="form-label-glass">Medical ID</label>
            <input type="text" id="registerMedicalId" class="form-control-glass" style="width:100%" placeholder="MED12345" required>
          </div>
          <div class="mb-3">
            <label class="form-label-glass">Email Address</label>
            <input type="email" id="registerEmail" class="form-control-glass" style="width:100%" placeholder="dr.smith@hospital.org" required>
          </div>
          <div class="mb-4">
            <label class="form-label-glass">Password</label>
            <input type="password" id="registerPassword" class="form-control-glass" style="width:100%" placeholder="••••••••" required>
          </div>
          <div id="registerError" class="text-danger mb-3" style="display:none;font-size:0.9rem"></div>
          <div id="registerSuccess" class="text-success mb-3" style="display:none;font-size:0.9rem">Registration successful! Please login.</div>
          <button type="submit" class="btn-primary-custom w-100 py-2">
            <i class="fas fa-user-plus me-2"></i> Register
          </button>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="index.html" style="color:var(--text-muted);font-size:0.85rem;text-decoration:none"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_BASE = "http://localhost:8000/api";

  document.getElementById('doctorLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('loginIdentifier').value;
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          role: 'doctor', 
          medical_id: identifier.includes('@') ? null : identifier,
          email: identifier.includes('@') ? identifier : null,
          password 
        })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('medirag_user', JSON.stringify(data.user));
        window.location.href = 'doctor.html';
      } else {
        errorDiv.textContent = data.detail || 'Login failed';
        errorDiv.style.display = 'block';
      }
    } catch (err) {
      errorDiv.textContent = 'Server error. Please try again later.';
      errorDiv.style.display = 'block';
    }
  });

  document.getElementById('doctorRegisterForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('registerName').value;
    const medicalId = document.getElementById('registerMedicalId').value;
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;
    const errorDiv = document.getElementById('registerError');
    const successDiv = document.getElementById('registerSuccess');
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          role: 'doctor', 
          name,
          medical_id: medicalId,
          email,
          password 
        })
      });
      const data = await res.json();
      if (data.success) {
        successDiv.style.display = 'block';
        document.getElementById('doctorRegisterForm').reset();
      } else {
        errorDiv.textContent = data.detail || 'Registration failed';
        errorDiv.style.display = 'block';
      }
    } catch (err) {
      errorDiv.textContent = 'Server error. Please try again later.';
      errorDiv.style.display = 'block';
    }
  });
</script>
</body>
</html>
